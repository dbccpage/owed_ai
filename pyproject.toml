[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anomalon-workbench"
version = "0.0.1.0"
readme = "README.md"
license = "Apache-2.0"
description = "Proposals, evidence, obligations and authority — independently inspectable"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2", "streamlit[auth]>=1.66,<2"]

[project.scripts]
anomalon = "anomalon_workbench.cli:main"
owed-migration = "anomalon_workbench.migration_demo:main"

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/anomalon_workbench"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "fixtures", "examples", "evidence", ".github", "app.py", "README.md", "LICENSE", "Dockerfile", ".dockerignore", "render.yaml", "pyproject.toml", "uv.lock", ".env.example", ".gitignore", ".gitattributes", ".python-version", "proof_knowledge_obligations_mvp.md", "lean/Ledger.lean", "lean/Migration.lean", "lean/lakefile.toml", "lean/lean-toolchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
